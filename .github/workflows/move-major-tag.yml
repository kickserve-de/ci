# After every push to main: runs the tests, then points the newest major tag
# (v1, later v2 …) at the pushed commit, so all @vN callers get the change.
# Older major tags stay put: tag main as vN+1 by hand before merging a breaking change.
# The tag only moves forward: a commit that is not ahead of it is left alone.
# GITHUB_TOKEN may not move a tag over workflow file changes; then add a repo
# secret TAG_TOKEN (fine-grained token on this repo: contents + workflows write).
# Then copies the tagged commit to the private mirrors in customer orgs (see README).
name: Move major tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, oldest first, so the tag never jumps back.
concurrency:
  group: move-major-tag
  cancel-in-progress: false

jobs:
  release-tests:
    uses: ./.github/workflows/release-tests.yml
  task-sync-tests:
    uses: ./.github/workflows/task-sync-tests.yml

  tag:
    needs: [release-tests, task-sync-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.move.outputs.tag }}
    steps:
      - name: Move the newest major tag
        id: move
        env:
          GH_TOKEN: ${{ secrets.TAG_TOKEN || github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          tag=$(gh api --paginate "$repo/tags?per_page=100" --jq '.[].name' | { grep -xE 'v[0-9]+' || true; } | sort -V | tail -n1)
          if [ -z "$tag" ]; then
            echo "::warning::No major tag (v1, v2 …) yet, nothing moved."; exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          old=$(gh api "$repo/commits/refs/tags/$tag" --jq .sha)
          status=$(gh api "$repo/compare/$old...$GITHUB_SHA" --jq .status)
          if [ "$status" != ahead ]; then
            echo "$tag stays on ${old:0:7} ($GITHUB_SHA is $status)."; exit 0
          fi
          gh api -X PATCH "$repo/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true --silent
          echo "Moved $tag from ${old:0:7} to ${GITHUB_SHA:0:7}." | tee -a "$GITHUB_STEP_SUMMARY"

  # Repos in other orgs cannot use this private repo, so each of those orgs gets a
  # private copy <org>/ci with main and the newest major tag. The copy points the
  # self references (kickserve-de/ci/...) at itself and drops this workflow.
  # Commit dates come from the source, so an unchanged tag gives the same commit
  # and the push is a no-op. Access: one write deploy key per copy, its private
  # key stored here as repo secret MIRROR_KEY_<ORG>.
  mirror:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - org: rabe-bike
            secret: MIRROR_KEY_RABE_BIKE
          - org: kitchenz
            secret: MIRROR_KEY_KITCHENZ
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Push the copy to ${{ matrix.org }}/ci
        env:
          ORG: ${{ matrix.org }}
          TAG: ${{ needs.tag.outputs.tag }}
          SSH_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Repo secret ${{ matrix.secret }} is missing."; exit 1
          fi
          key="$RUNNER_TEMP/mirror_key"
          printf '%s\n' "$SSH_KEY" > "$key" && chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"

          src=$(git rev-parse HEAD)
          git rm -q .github/workflows/move-major-tag.yml
          grep -rlZ 'kickserve-de/ci/' --exclude-dir=.git . | xargs -0 -r sed -i "s#kickserve-de/ci/#$ORG/ci/#g"
          git add -A
          export GIT_AUTHOR_DATE=$(git show -s --format=%cI "$src") GIT_COMMITTER_DATE=$(git show -s --format=%cI "$src")
          git -c user.name=kickserve-ci -c user.email=ci@kickserve.de \
            commit -q -m "Mirror of kickserve-de/ci@$src for $ORG"

          git push --force "git@github.com:$ORG/ci.git" "HEAD:refs/heads/main" "HEAD:refs/tags/$TAG"
          echo "$ORG/ci: $TAG = kickserve-de/ci@${src:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
