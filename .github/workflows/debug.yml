name: debug
on: pull_request
jobs:
  d:
    runs-on: self-hosted
    steps:
      - run: |
          for w in /home/kickserve/actions-runner*/github_runner_work/rotwild-*/rotwild-*; do
            echo "=== $w"
            ls "$w" | head -20 | tr '\n' ' '; echo
            git -C "$w" config --list --show-origin | grep -iE "sparse|worktreeconfig" || echo "no sparse config"
            cat "$w/.git/config.worktree" 2>/dev/null
            cat "$w/.git/info/sparse-checkout" 2>/dev/null | head -3
          done
