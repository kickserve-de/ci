# Copy production to staging on a Deployer host: the production database is dumped,
# anonymized on the runner with the repo's SQL file (personal data never reaches
# staging or the snapshot), imported into staging, shared folders are copied on the
# host, and optionally the anonymized dump and a folder archive go to Google Drive
# as the snapshot for local setups.
#
# Holds the deploy-production concurrency group while dumping and deploy-staging while
# writing staging, the groups deploy-deployer.yml uses: no deploy runs at the same time.
# A repo with its own deploy workflow puts its deploy job into the same groups.
name: Sync staging

on:
  workflow_call:
    inputs:
      ssh-host:
        type: string
        required: true
      ssh-user:
        type: string
        required: true
      ssh-port:
        type: string
        default: '22'
      production-path:
        description: Deployer deploy_path of production on the host
        type: string
        required: true
      staging-path:
        description: Deployer deploy_path of staging on the host
        type: string
        required: true
      env-file:
        description: Env file with the database settings, relative to each deploy path (sourced by sh on the host)
        type: string
        default: shared/.env
      db-env:
        description: Names of the host, port, user, password and database variables in env-file, in this order
        type: string
        default: DB_HOST DB_PORT DB_USERNAME DB_PASSWORD DB_DATABASE
      dump-options:
        description: Options for mysqldump on the host
        type: string
        default: --single-transaction --quick --no-tablespaces --routines --triggers
      db-image:
        description: Docker image of the throwaway database the anonymization runs in; match the server's database
        type: string
        default: mariadb:10.11
      anonymize-sql:
        description: SQL file in the repo that removes personal data; required, the sync stops without it
        type: string
        default: dev/data/anonymize.sql
      keep-tables:
        description: Staging tables kept across the sync (space separated), e.g. backend users
        type: string
        default: ''
      sync-dirs:
        description: Folders copied from production to staging, relative to shared/ (space separated); staging-only files in them are deleted
        type: string
        default: ''
      exclude:
        description: Patterns left out of the folder copy and the archive, relative to shared/ (space separated), e.g. upload folders with personal files
        type: string
        default: ''
      after-sync:
        description: Command run in staging's current/ after the import and the snapshot (a failure does not block the snapshot), e.g. the deploy's migrations (staging code can be ahead of production) and a cache flush
        type: string
        default: ''
      snapshot-folder-id:
        description: Google Drive folder for the snapshot (anonymized dump + sync-dirs archive); empty skips it
        type: string
        default: ''
      snapshot-name:
        description: File name prefix of the snapshot; default the repo name
        type: string
        default: ''
      snapshot-keep-days:
        description: Dated snapshots older than this are deleted from the folder
        type: string
        default: '30'
      rclone-remote:
        description: Google Drive remote name in RCLONE_CONFIG_CONTENT
        type: string
        default: gdrive
      runner:
        description: Needs Docker (throwaway database)
        type: string
        default: ubuntu-latest
    secrets:
      SSH_PRIVATE_KEY:
        description: Key for ssh-user on ssh-host (repo secret; the jobs have no environment, so they create no deployment records)
        required: true
      RCLONE_CONFIG_CONTENT:
        description: base64 of an rclone.conf with the Google Drive remote; needed for the snapshot
        required: false

env:
  SSH_HOST: ${{ inputs.ssh-host }}
  SSH_USER: ${{ inputs.ssh-user }}
  SSH_PORT: ${{ inputs.ssh-port }}
  ENV_FILE: ${{ inputs.env-file }}
  DB_ENV: ${{ inputs.db-env }}
  DUMP_OPTIONS: ${{ inputs.dump-options }}
  PRODUCTION_PATH: ${{ inputs.production-path }}
  STAGING_PATH: ${{ inputs.staging-path }}

jobs:
  dump:
    name: Dump and anonymize production
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    services:
      db:
        image: ${{ inputs.db-image }}
        env:
          MARIADB_ROOT_PASSWORD: sync
          MYSQL_ROOT_PASSWORD: sync
          MARIADB_DATABASE: sync
          MYSQL_DATABASE: sync
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ inputs.anonymize-sql }}
          sparse-checkout-cone-mode: false

      - name: Anonymize SQL present
        env:
          ANONYMIZE_SQL: ${{ inputs.anonymize-sql }}
        run: |
          [ -s "$ANONYMIZE_SQL" ] || { echo "::error::$ANONYMIZE_SQL is missing or empty; the sync never runs without anonymizing"; exit 1; }

      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          d="$RUNNER_TEMP/sync-ssh"; install -d -m 700 "$d"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"; chmod 600 "$d/key"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > "$d/known_hosts" 2>/dev/null
          printf 'Host sync-target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile %s/key\n  IdentitiesOnly yes\n  UserKnownHostsFile %s/known_hosts\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" "$d" "$d" > "$d/config"
          echo "SSH=ssh -F $d/config sync-target" >> "$GITHUB_ENV"

      - name: Dump production
        run: |
          read -r V_HOST V_PORT V_USER V_PASS V_NAME <<< "$DB_ENV"
          # The env file is read on the host: the password never leaves it and is not in argv.
          $SSH "cd '$PRODUCTION_PATH' && set -a && . './$ENV_FILE' && set +a && export MYSQL_PWD=\"\${$V_PASS}\" && mysqldump -h \"\${$V_HOST}\" -P \"\${$V_PORT:-3306}\" -u \"\${$V_USER}\" $DUMP_OPTIONS \"\${$V_NAME}\" | gzip" > production.sql.gz
          # The host shell has no pipefail: a failed mysqldump still leaves a valid gzip, so check its end marker.
          gunzip -c production.sql.gz | tail -n 1 | grep -q "Dump completed" || { echo "::error::production dump is incomplete"; exit 1; }
          echo "production dump: $(du -h production.sql.gz | cut -f1)"

      - name: Anonymize
        env:
          DB: ${{ job.services.db.id }}
          ANONYMIZE_SQL: ${{ inputs.anonymize-sql }}
        run: |
          client="$(docker exec "$DB" sh -c 'command -v mariadb || command -v mysql')"
          dumper="$(docker exec "$DB" sh -c 'command -v mariadb-dump || command -v mysqldump')"
          sql() { docker exec -i -e MYSQL_PWD=sync "$DB" "$client" -uroot "$@"; }
          for _ in $(seq 60); do sql -e 'SELECT 1' sync >/dev/null 2>&1 && break; sleep 2; done
          gunzip -c production.sql.gz | sql --max-allowed-packet=1G sync
          rm -f production.sql.gz
          sql sync < "$ANONYMIZE_SQL"
          docker exec -e MYSQL_PWD=sync "$DB" "$dumper" -uroot --single-transaction --quick --routines --triggers sync | gzip > anonymized.sql.gz
          gzip -t anonymized.sql.gz
          echo "anonymized dump: $(du -h anonymized.sql.gz | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: anonymized-db
          path: anonymized.sql.gz
          retention-days: 1

      - name: Clean up
        if: always()
        run: rm -rf production.sql.gz anonymized.sql.gz "$RUNNER_TEMP/sync-ssh"

  sync:
    name: Write staging
    needs: dump
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SYNC_DIRS: ${{ inputs.sync-dirs }}
      EXCLUDE: ${{ inputs.exclude }}
    steps:
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          d="$RUNNER_TEMP/sync-ssh"; install -d -m 700 "$d"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"; chmod 600 "$d/key"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > "$d/known_hosts" 2>/dev/null
          printf 'Host sync-target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile %s/key\n  IdentitiesOnly yes\n  UserKnownHostsFile %s/known_hosts\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" "$d" "$d" > "$d/config"
          echo "SSH=ssh -F $d/config sync-target" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: anonymized-db

      - name: Keep staging tables
        if: inputs.keep-tables != ''
        env:
          KEEP_TABLES: ${{ inputs.keep-tables }}
        run: |
          read -r V_HOST V_PORT V_USER V_PASS V_NAME <<< "$DB_ENV"
          $SSH "cd '$STAGING_PATH' && set -a && . './$ENV_FILE' && set +a && export MYSQL_PWD=\"\${$V_PASS}\" && mysqldump -h \"\${$V_HOST}\" -P \"\${$V_PORT:-3306}\" -u \"\${$V_USER}\" $DUMP_OPTIONS \"\${$V_NAME}\" $KEEP_TABLES | gzip" > keep.sql.gz
          gunzip -c keep.sql.gz | tail -n 1 | grep -q "Dump completed" || { echo "::error::staging dump of keep-tables is incomplete"; exit 1; }

      - name: Import into staging
        run: |
          read -r V_HOST V_PORT V_USER V_PASS V_NAME <<< "$DB_ENV"
          db_of() { $SSH "cd '$1' && set -a && . './$ENV_FILE' && set +a && echo \"\${$V_HOST}:\${$V_PORT:-3306}/\${$V_NAME}\""; }
          prod_db="$(db_of "$PRODUCTION_PATH")"; staging_db="$(db_of "$STAGING_PATH")"
          if [ -z "$staging_db" ] || [ "$staging_db" = "$prod_db" ]; then
            echo "::error::staging and production use the same database ($staging_db); nothing imported"; exit 1
          fi
          mysql_staging="cd '$STAGING_PATH' && set -a && . './$ENV_FILE' && set +a && export MYSQL_PWD=\"\${$V_PASS}\" && mysql -h \"\${$V_HOST}\" -P \"\${$V_PORT:-3306}\" -u \"\${$V_USER}\" \"\${$V_NAME}\""
          gunzip -c anonymized.sql.gz | $SSH "$mysql_staging"
          if [ -f keep.sql.gz ]; then gunzip -c keep.sql.gz | $SSH "$mysql_staging"; fi

      - name: Copy folders
        if: inputs.sync-dirs != ''
        run: |
          src=""; for d in $SYNC_DIRS; do src="$src '$PRODUCTION_PATH/shared/./$d'"; done
          ex=""; for p in $EXCLUDE; do ex="$ex --exclude='$p'"; done
          # --relative keeps the paths below shared/, so the exclude patterns read the same as in the archive.
          $SSH "rsync -a --relative --delete --delete-excluded $ex $src '$STAGING_PATH/shared/'"

      - name: Snapshot to Google Drive
        if: inputs.snapshot-folder-id != ''
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
          FOLDER: ${{ inputs.snapshot-folder-id }}
          NAME: ${{ inputs.snapshot-name || github.event.repository.name }}
          REMOTE: ${{ inputs.rclone-remote }}
          KEEP_DAYS: ${{ inputs.snapshot-keep-days }}
        run: |
          [ -n "$RCLONE_CONFIG_CONTENT" ] || { echo "::error::secret RCLONE_CONFIG_CONTENT is not set"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/rclone.zip" https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.zip
          unzip -qjo "$RUNNER_TEMP/rclone.zip" '*/rclone' -d "$RUNNER_TEMP/sync-ssh"
          printf '%s' "$RCLONE_CONFIG_CONTENT" | base64 -d > "$RUNNER_TEMP/sync-ssh/rclone.conf"
          rc() { "$RUNNER_TEMP/sync-ssh/rclone" --config "$RUNNER_TEMP/sync-ssh/rclone.conf" --drive-root-folder-id "$FOLDER" "$@"; }
          stamp="$(date -u +%Y%m%d-%H%M)"
          rc copyto anonymized.sql.gz "$REMOTE:$NAME-db-$stamp.sql.gz"
          rc copyto "$REMOTE:$NAME-db-$stamp.sql.gz" "$REMOTE:$NAME-db-latest.sql.gz"
          if [ -n "$SYNC_DIRS" ]; then
            ex=""; for p in $EXCLUDE; do ex="$ex --exclude='$p'"; done
            $SSH "tar czf - -C '$STAGING_PATH/shared' $ex $SYNC_DIRS" | rc rcat "$REMOTE:$NAME-files-$stamp.tgz"
            rc copyto "$REMOTE:$NAME-files-$stamp.tgz" "$REMOTE:$NAME-files-latest.tgz"
          fi
          rc delete "$REMOTE:" --min-age "${KEEP_DAYS}d" --include "$NAME-db-2*" --include "$NAME-files-2*"
          rc lsl "$REMOTE:" --include "$NAME-*-latest.*"

      - name: After sync
        if: inputs.after-sync != ''
        # Last: a failing migration leaves the snapshot (production schema, for local setups from main) in place.
        env:
          AFTER_SYNC: ${{ inputs.after-sync }}
        run: $SSH "cd '$STAGING_PATH/current' && $AFTER_SYNC"

      - name: Clean up
        if: always()
        run: rm -rf anonymized.sql.gz keep.sql.gz "$RUNNER_TEMP/sync-ssh"
