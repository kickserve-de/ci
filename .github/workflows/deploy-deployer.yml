# Deploy with Deployer (deploy.php in the repo), then smoke test and Lighthouse.
# Production only deploys when the PR checks on the commit are green (the gate
# waits while they still run). Required reviewers on the "production" environment
# would add an approval, but need GitHub Enterprise for private repos.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (staging or production)
        type: string
        required: true
      host:
        description: Deployer host from deploy.php
        type: string
        required: true
      url:
        description: Public base URL of the environment, without trailing slash
        type: string
        required: true
      runner:
        type: string
        default: self-hosted
      php-version:
        type: string
        default: '8.4'
      php-extensions:
        description: Extra PHP extensions for setup-php (comma separated), on top of the ext-* requirements in composer.json and composer.lock
        type: string
        default: ''
      deployer-version:
        description: Deployer version to download; empty uses deployer/deployer from composer.lock (require or require-dev)
        type: string
        default: ''
      node-version:
        type: string
        default: '20'
      tools:
        description: Extra CLI tools to set up before the commands run (space separated); supported - shopware-cli
        type: string
        default: ''
      shopware-cli:
        description: Deprecated, use tools - shopware-cli
        type: boolean
        default: false
      build:
        description: Commands run on the runner before `dep deploy`
        type: string
        default: composer install --no-interaction --no-progress --prefer-dist
      env-secrets:
        description: Secret names (space or newline separated) exported as environment variables for the build and `dep deploy`, e.g. when deploy.php writes a config file into the release (needs secrets inherit; sees the secrets of the GitHub environment)
        type: string
        default: ''
      gate-workflow:
        description: PR-checks workflow file the production gate reads
        type: string
        default: pr.yml
      smoke-paths:
        type: string
        default: /
      lighthouse-paths:
        type: string
        default: /
      lighthouse-min:
        type: string
        default: '50'
      lighthouse-target:
        type: string
        default: '80'
      required-requests:
        description: URL parts every Lighthouse path must request in the browser, e.g. googletagmanager.com/gtm.js?id=GTM-XXXX (space separated); a missing one fails the deploy
        type: string
        default: ''
      warmup-hits:
        description: Requests per Lighthouse path before measuring (raise for load-balanced setups)
        type: string
        default: '2'
    secrets:
      SSH_PRIVATE_KEY:
        # Not required: GitHub checks required secrets for every job, also post-deploy,
        # which has no environment and so cannot see a key kept only as an environment
        # secret. The Deploy step still fails without it.
        description: Deploy key (repo or environment secret)
        required: false
      BASIC_AUTH:
        description: user:password if the environment is behind basic auth
        required: false
      CHECK_TOKEN:
        description: Sent as X-Kickserve-Check header by the smoke test, so a WAF rule can let it through
        required: false

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  gate:
    if: inputs.environment == 'production'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: kickserve-de/ci/actions/check-gate@v1
        with:
          workflow: ${{ inputs.gate-workflow }}

  deploy:
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    # Never two deploys to the same environment at once, never cancel one halfway.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: kickserve-de/ci/actions/checkout@v1

      # PHP extensions from ext-* in composer.json and in the locked packages (no dev, like the build),
      # plus php-extensions; setup-php skips the ones already built in.
      - name: PHP extensions
        id: ext
        env:
          EXTRA: ${{ inputs.php-extensions }}
        run: |
          declared=""
          if [ -f composer.json ]; then
            declared+=$(jq -r '.require // {} | keys[]' composer.json)$'\n'
          fi
          if [ -f composer.lock ]; then
            declared+=$(jq -r '[.packages[]] | map(.require // {} | keys[]) | .[]' composer.lock)
          fi
          list=$( { printf '%s\n' "$declared" | sed -n 's/^ext-//p'; printf '%s\n' ${EXTRA//,/ }; } | sed '/^$/d' | tr 'A-Z' 'a-z' | sort -u | paste -sd, - )
          echo "PHP extensions: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ steps.ext.outputs.list }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - if: contains(format(' {0} ', inputs.tools), ' shopware-cli ') || inputs.shopware-cli
        name: Set up shopware-cli
        uses: shopware/shopware-cli-action@v1

      # A missing secret stays unset; deploy.php decides whether that is fatal.
      # Exported before the build, so a build that bakes in a secret (e.g. an API token) sees it.
      - name: Export deploy secrets
        if: inputs.env-secrets != ''
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          NAMES: ${{ inputs.env-secrets }}
        run: |
          for name in $NAMES; do
            case "$name" in
              [!A-Za-z_]*|*[!A-Za-z0-9_]*) echo "::error::invalid secret name: $name"; exit 1 ;;
            esac
            if ! jq -e --arg n "$name" 'has($n)' <<<"$SECRETS_JSON" >/dev/null; then
              echo "::warning::secret $name is not set for environment ${{ inputs.environment }}"
              continue
            fi
            delimiter="EOF_$(openssl rand -hex 16)"
            { echo "$name<<$delimiter"; jq -r --arg n "$name" '.[$n]' <<<"$SECRETS_JSON"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done

      - name: Build
        run: ${{ inputs.build }}

      # deployphp/action only reads deployer/deployer from "packages" in composer.lock;
      # as a dev dependency it is in "packages-dev" and missing after --no-dev.
      - name: Deployer version
        id: deployer
        env:
          VERSION: ${{ inputs.deployer-version }}
        run: |
          if [ -z "$VERSION" ] && [ -f composer.lock ]; then
            VERSION=$(jq -r '[.packages[], (.["packages-dev"] // [])[]] | map(select(.name == "deployer/deployer")) | first | .version // empty' composer.lock)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # deploy.php uploads the checked-out tree, so the deployed code is exactly github.sha.
      - name: Deploy
        uses: deployphp/action@v1
        with:
          dep: deploy ${{ inputs.host }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          deployer-version: ${{ steps.deployer.outputs.version }}

  post-deploy:
    needs: deploy
    # The skipped gate on staging would otherwise skip this job too.
    if: always() && needs.deploy.result == 'success'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: kickserve-de/ci/actions/post-deploy@v1
        with:
          environment: ${{ inputs.environment }}
          url: ${{ inputs.url }}
          smoke-paths: ${{ inputs.smoke-paths }}
          lighthouse-paths: ${{ inputs.lighthouse-paths }}
          lighthouse-min: ${{ inputs.lighthouse-min }}
          lighthouse-target: ${{ inputs.lighthouse-target }}
          required-requests: ${{ inputs.required-requests }}
          warmup-hits: ${{ inputs.warmup-hits }}
          basic-auth: ${{ secrets.BASIC_AUTH }}
          check-token: ${{ secrets.CHECK_TOKEN }}
