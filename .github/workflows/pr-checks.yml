# Checks for every PR (and every push to main, which the production gate reads).
# The caller turns on the runtimes it needs and passes its own commands; each
# non-empty command is one check. The report step turns them into the traffic
# light in the PR description and one GitHub check per result.
name: PR checks

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label
        type: string
        default: self-hosted
      # Runtimes and tools
      php:
        description: Set up PHP and composer
        type: boolean
        default: false
      php-version:
        type: string
        default: '8.4'
      php-extensions:
        description: Extra PHP extensions for setup-php (comma separated), on top of the ext-* requirements in composer.json and composer.lock
        type: string
        default: ''
      node:
        description: Set up Node
        type: boolean
        default: false
      node-version:
        type: string
        default: '20'
      package-manager:
        description: npm or yarn (yarn 1), used by the audit check
        type: string
        default: npm
      shopware-cli:
        description: Install shopware-cli (for a build command that uses it)
        type: boolean
        default: false
      # Commands: each non-empty one is a check of the same name
      install:
        description: Install dependencies (e.g. composer install, npm ci)
        type: string
        default: ''
      lint:
        type: string
        default: ''
      lint-level:
        description: hard or soft
        type: string
        default: soft
      typecheck:
        type: string
        default: ''
      typecheck-level:
        description: hard or soft
        type: string
        default: soft
      test:
        description: Test command; reported as the check "tests"
        type: string
        default: ''
      build:
        type: string
        default: ''
      build-dirs:
        description: Sub-packages with their own package.json that must build (space separated), part of the check "build"
        type: string
        default: ''
      # Built-in checks
      syntax-paths:
        description: Directories whose PHP files get a syntax check (space separated)
        type: string
        default: ''
      audit:
        description: composer audit (with php and a composer.lock) and npm/yarn audit (with node), as a warning
        type: boolean
        default: true
      migrations:
        description: List the migrations a PR adds (Shopware, Laravel, Doctrine, Magento patches, TYPO3) and check Shopware timestamps
        type: boolean
        default: true
      translation-dirs:
        description: Snippet directories with <name>.<locale>.json files to compare (space separated, globs allowed), empty to skip
        type: string
        default: ''
      translation-level:
        type: string
        default: soft

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checks:
    name: checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    concurrency:
      group: pr-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: kickserve-de/ci/actions/checkout@v1

      # PHP extensions from ext-* in composer.json and in the locked packages (incl. dev),
      # plus php-extensions; setup-php skips the ones already built in.
      - if: inputs.php
        name: PHP extensions
        id: ext
        env:
          EXTRA: ${{ inputs.php-extensions }}
        run: |
          declared=""
          if [ -f composer.json ]; then
            declared+=$(jq -r '(.require // {}) + (."require-dev" // {}) | keys[]' composer.json)$'\n'
          fi
          if [ -f composer.lock ]; then
            declared+=$(jq -r '[.packages[], .["packages-dev"][]?] | map(.require // {} | keys[]) | .[]' composer.lock)
          fi
          list=$( { printf '%s\n' "$declared" | sed -n 's/^ext-//p'; printf '%s\n' ${EXTRA//,/ }; } | sed '/^$/d' | tr 'A-Z' 'a-z' | sort -u | paste -sd, - )
          echo "PHP extensions: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - if: inputs.php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ steps.ext.outputs.list }}
          tools: composer:v2
          coverage: none

      - if: inputs.node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # ubuntu-latest ships yarn 1, our self-hosted runners do not
      - if: inputs.node && inputs.package-manager == 'yarn'
        name: Provide yarn 1
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          command -v yarn >/dev/null || { corepack enable && yarn --version >/dev/null; } || npm install -g yarn@1
          yarn --version

      - if: inputs.shopware-cli
        uses: shopware/shopware-cli-action@v1

      - if: inputs.php && hashFiles('composer.json') != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: validate
          run: composer validate --no-check-publish --no-check-all
      - if: inputs.install != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: install
          run: ${{ inputs.install }}
      - if: inputs.audit && (inputs.php || inputs.node)
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: audit
          level: soft
          run: |
            rc=0
            if [ "${{ inputs.php }}" = true ] && [ -f composer.lock ]; then
              composer audit --locked --no-interaction || rc=1
            fi
            if [ "${{ inputs.node }}" = true ] && [ -f package.json ]; then
              if [ "${{ inputs.package-manager }}" = yarn ]; then yarn audit --groups dependencies --level high || rc=1
              else npm audit --omit=dev --audit-level=high || rc=1; fi
            fi
            exit "$rc"
      - if: inputs.syntax-paths != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: syntax
          run: |
            out="$(find ${{ inputs.syntax-paths }} -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 \
              | xargs -0 -n1 -P4 php -d display_errors=stderr -l 2>&1)" \
              || { grep -v '^No syntax errors' <<<"$out"; exit 1; }
            echo "$(grep -c '^No syntax errors' <<<"$out") files OK"
      - if: inputs.lint != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: lint
          level: ${{ inputs.lint-level }}
          run: ${{ inputs.lint }}
      - if: inputs.typecheck != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: typecheck
          level: ${{ inputs.typecheck-level }}
          run: ${{ inputs.typecheck }}
      - if: inputs.test != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: tests
          run: ${{ inputs.test }}
      - if: inputs.build != '' || inputs.build-dirs != ''
        uses: kickserve-de/ci/actions/run-check@v1
        env:
          BUILD_DIRS: ${{ inputs.build-dirs }}
        with:
          name: build
          run: |
            ${{ inputs.build || ':' }}
            for dir in $BUILD_DIRS; do
              echo "→ $dir"
              (cd "$dir" && { [ -f package-lock.json ] && npm ci --no-audit --no-fund || npm install --no-audit --no-fund; } && npm run build)
            done

      # Content of the change itself
      - if: inputs.migrations && github.event_name == 'pull_request'
        uses: kickserve-de/ci/actions/run-check@v1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          name: migrations
          pass-detail: output
          run: |
            files=()
            for page in $(seq 1 30); do
              mapfile -t batch < <(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page" \
                | jq -r '.[] | select(.status != "removed") | .filename')
              [ ${#batch[@]} -gt 0 ] || break
              files+=("${batch[@]}")
            done
            [ ${#files[@]} -gt 0 ] || { echo "no changed files"; exit 0; }
            bash "$KICKSERVE_CI_LIB/check-migrations.sh" "${files[@]}"
      - if: inputs.translation-dirs != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: translations
          level: ${{ inputs.translation-level }}
          pass-detail: output
          run: |
            shopt -s nullglob
            dirs=()
            for d in ${{ inputs.translation-dirs }}; do [ -d "$d" ] && dirs+=("$d"); done
            [ ${#dirs[@]} -gt 0 ] || { echo "no snippet directories found"; exit 0; }
            if out="$(bash "$KICKSERVE_CI_LIB/check-translations.sh" "${dirs[@]}")"; then
              echo "${#dirs[@]} directories complete"
            else
              echo "$out"
              echo "$(grep -c . <<<"$out") findings, first: $(head -n1 <<<"$out")"
              exit 1
            fi

      - if: always()
        uses: kickserve-de/ci/actions/report@v1
        with:
          title: PR checks
          key: pr-checks
          shas: ${{ github.event.pull_request.head.sha || github.sha }}
          prs: ${{ github.event.pull_request.number }}
