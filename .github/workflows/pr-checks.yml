# Checks for every PR (and every push to main, which the production gate reads).
# Each enabled input adds checks; the report job turns them into the traffic
# light in the PR description and one GitHub check per result.
name: PR checks

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label
        type: string
        default: self-hosted
      php-version:
        type: string
        default: '8.3'
      node-version:
        type: string
        default: '20'
      composer:
        description: composer validate + audit (and install when composer-install is true)
        type: boolean
        default: false
      composer-install:
        type: boolean
        default: true
      php-lint-paths:
        description: Directories whose PHP files get a syntax check (space separated)
        type: string
        default: ''
      npm-build-dirs:
        description: Directories with their own package.json that must build (space separated)
        type: string
        default: ''
      shopware-build:
        description: Run `shopware-cli project ci .` (the same build the deploy uses)
        type: boolean
        default: false
      node:
        description: Root Node app checks (install, lint, typecheck, tests, build, audit)
        type: boolean
        default: false
      node-lint-level:
        type: string
        default: soft
      node-typecheck-level:
        type: string
        default: soft
      node-test:
        description: Test command, empty to skip
        type: string
        default: ''
      node-package-manager:
        description: npm or yarn (yarn 1, yarn.lock)
        type: string
        default: npm
      node-install:
        description: Install command, empty for the package manager default (npm ci / yarn install --frozen-lockfile)
        type: string
        default: ''
      node-scripts:
        description: Which of the package.json scripts lint, typecheck and build exist (space separated); the others are skipped
        type: string
        default: lint typecheck build
      migrations:
        description: List the migrations a PR adds (Shopware, Laravel, Doctrine, Magento patches, TYPO3) and check Shopware timestamps
        type: boolean
        default: true
      translation-dirs:
        description: Snippet directories with <name>.<locale>.json files to compare (space separated, globs allowed), empty to skip
        type: string
        default: ''
      translation-level:
        type: string
        default: soft

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checks:
    name: checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    concurrency:
      group: pr-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: kickserve-de/ci/actions/checkout@v1

      - if: inputs.composer || inputs.php-lint-paths != '' || inputs.shopware-build
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: none

      - if: inputs.node || inputs.npm-build-dirs != '' || inputs.shopware-build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # ubuntu-latest ships yarn 1, our self-hosted runners do not
      - if: inputs.node && inputs.node-package-manager == 'yarn'
        name: Provide yarn 1
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          command -v yarn >/dev/null || { corepack enable && yarn --version >/dev/null; } || npm install -g yarn@1
          yarn --version

      # PHP
      - if: inputs.composer
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: composer validate
          run: composer validate --no-check-publish --no-check-all
      - if: inputs.composer && inputs.composer-install
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: composer install
          run: composer install --no-interaction --no-progress --prefer-dist
      - if: inputs.composer
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: composer audit
          level: soft
          run: composer audit --locked --no-interaction
      - if: inputs.php-lint-paths != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: php syntax
          run: |
            out="$(find ${{ inputs.php-lint-paths }} -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 \
              | xargs -0 -n1 -P4 php -d display_errors=stderr -l 2>&1)" \
              || { grep -v '^No syntax errors' <<<"$out"; exit 1; }
            echo "$(grep -c '^No syntax errors' <<<"$out") files OK"

      # Builds of sub-packages (e.g. Kirby plugins)
      - if: inputs.npm-build-dirs != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: plugin builds
          run: |
            for dir in ${{ inputs.npm-build-dirs }}; do
              echo "→ $dir"
              (cd "$dir" && { [ -f package-lock.json ] && npm ci --no-audit --no-fund || npm install --no-audit --no-fund; } && npm run build)
            done

      # Shopware
      - if: inputs.shopware-build
        uses: shopware/shopware-cli-action@v1
      - if: inputs.shopware-build
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: shopware build
          run: shopware-cli project ci .

      # Node app
      - if: inputs.node
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: install
          # ':' keeps the then-branch non-empty when node-install is unset (bash syntax error otherwise).
          run: |
            if [ -n "${{ inputs.node-install }}" ]; then ${{ inputs.node-install || ':' }}
            elif [ "${{ inputs.node-package-manager }}" = yarn ]; then yarn install --frozen-lockfile --non-interactive
            else npm ci --no-audit --no-fund; fi
      - if: inputs.node && contains(format(' {0} ', inputs.node-scripts), ' lint ')
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: lint
          level: ${{ inputs.node-lint-level }}
          run: ${{ inputs.node-package-manager }} run lint
      - if: inputs.node && contains(format(' {0} ', inputs.node-scripts), ' typecheck ')
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: typecheck
          level: ${{ inputs.node-typecheck-level }}
          run: ${{ inputs.node-package-manager }} run typecheck
      - if: inputs.node && inputs.node-test != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: tests
          run: ${{ inputs.node-test }}
      - if: inputs.node && contains(format(' {0} ', inputs.node-scripts), ' build ')
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: build
          run: ${{ inputs.node-package-manager }} run build
      - if: inputs.node
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: audit
          level: soft
          run: |
            if [ "${{ inputs.node-package-manager }}" = yarn ]; then yarn audit --groups dependencies --level high
            else npm audit --omit=dev --audit-level=high; fi

      # Content of the change itself
      - if: inputs.migrations && github.event_name == 'pull_request'
        uses: kickserve-de/ci/actions/run-check@v1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          name: migrations
          pass-detail: output
          run: |
            files=()
            for page in $(seq 1 30); do
              mapfile -t batch < <(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page" \
                | jq -r '.[] | select(.status != "removed") | .filename')
              [ ${#batch[@]} -gt 0 ] || break
              files+=("${batch[@]}")
            done
            [ ${#files[@]} -gt 0 ] || { echo "no changed files"; exit 0; }
            bash "$KICKSERVE_CI_LIB/check-migrations.sh" "${files[@]}"
      - if: inputs.translation-dirs != ''
        uses: kickserve-de/ci/actions/run-check@v1
        with:
          name: translations
          level: ${{ inputs.translation-level }}
          pass-detail: output
          run: |
            shopt -s nullglob
            dirs=()
            for d in ${{ inputs.translation-dirs }}; do [ -d "$d" ] && dirs+=("$d"); done
            [ ${#dirs[@]} -gt 0 ] || { echo "no snippet directories found"; exit 0; }
            if out="$(bash "$KICKSERVE_CI_LIB/check-translations.sh" "${dirs[@]}")"; then
              echo "${#dirs[@]} directories complete"
            else
              echo "$out"
              echo "$(grep -c . <<<"$out") findings, first: $(head -n1 <<<"$out")"
              exit 1
            fi

      - if: always()
        uses: kickserve-de/ci/actions/report@v1
        with:
          title: PR checks
          key: pr-checks
          shas: ${{ github.event.pull_request.head.sha || github.sha }}
          prs: ${{ github.event.pull_request.number }}
