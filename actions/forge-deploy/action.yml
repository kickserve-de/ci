name: Deploy with Laravel Forge
description: >
  Starts a Forge deployment of a site through its deploy hook and waits until it
  has ended (status through the Forge API). Fails when it fails, is cancelled,
  times out or deployed another commit than sha. Turn off quick deploy (deploy
  on push) for the site, so every deploy runs through here.

inputs:
  organization:
    description: Forge organization slug
    required: true
  server:
    description: Forge server id
    required: true
  site:
    description: Forge site id
    required: true
  deploy-hook:
    description: Deploy hook URL of the site (pass a secret)
    required: true
  token:
    description: Forge API token with server:view, only reads the deployment status (pass a secret)
    required: true
  sha:
    default: ${{ github.sha }}
  timeout:
    description: Seconds to wait before failing
    default: '1800'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEPLOY_HOOK: ${{ inputs.deploy-hook }}
        FORGE_API_TOKEN: ${{ inputs.token }}
        ORGANIZATION: ${{ inputs.organization }}
        SERVER: ${{ inputs.server }}
        SITE: ${{ inputs.site }}
        SHA: ${{ inputs.sha }}
        TIMEOUT: ${{ inputs.timeout }}
      run: bash "$GITHUB_ACTION_PATH/deploy.sh"
