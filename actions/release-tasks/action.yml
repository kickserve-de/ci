name: Release tasks
description: >
  After a production deploy of version N: every task referenced in the commits since the
  previous version gets the comment "Live mit Version N: <release>", and moves to the Done
  section of its projects (never completed) when it is in "Ready for Deployment" there. Does nothing when version N has no
  successful deployment to the environment. Task IDs as in task-sync (first ID per commit
  message). Works with any Asana-compatible API (Asana, Kickserve Work).

inputs:
  version:
    description: Version number (tag) that was deployed
    required: true
  environment:
    description: GitHub environment the version was deployed to
    default: production
  done-section:
    description: Section the tasks move to (case-insensitive)
    default: Done
  ready-section:
    description: Only tasks in this section move (case-insensitive); tasks elsewhere only get the comment
    default: Ready for Deployment
  token:
    description: Task tracker token (Asana PAT or Kickserve Work token); empty = tasks are not updated
    default: ''
  api:
    description: API base, empty for Asana (Kickserve Work https://<host>/api/1.0)
    default: ''
  github-token:
    description: Needs contents read (tags, releases, compare) and deployments read
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Range: previous version → N. Version 1 starts at the newest older release or tag, else at the
    # last successful deployment of another commit, so it never covers the whole history.
    - name: Collect tasks
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
        ENVIRONMENT: ${{ inputs.environment }}
        LIB: ${{ github.action_path }}/../../lib
        TASK_SYNC: ${{ github.action_path }}/../task-sync
        DIR: ${{ github.action_path }}
        TASKS: ${{ runner.temp }}/release-tasks.txt
      run: |
        repo="repos/$GITHUB_REPOSITORY"
        url=$(gh api "$repo/releases/tags/$VERSION" --jq .html_url)
        # Full ref names: a number like 2026 could also read as an abbreviated commit.
        sha=$(gh api "$repo/commits/refs/tags/$VERSION" --jq .sha)
        echo "url=$url" >> "$GITHUB_OUTPUT"

        if [ "$(bash "$LIB/deployments.sh" live "$ENVIRONMENT" "$sha")" != true ]; then
          echo "::warning::Version $VERSION has no successful deployment to $ENVIRONMENT, tasks not updated."
          echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
        fi

        tags="$RUNNER_TEMP/release-tags.txt" releases="$RUNNER_TEMP/release-releases.txt"
        gh api --paginate "$repo/tags?per_page=100" --jq '.[] | "\(.name) \(.commit.sha)"' > "$tags"
        gh api --paginate "$repo/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name' > "$releases"
        base=$(bash "$LIB/next-version.sh" previous "$VERSION" "$tags" "$releases")
        if [ -n "$base" ]; then base="refs/tags/$base"
        else base=$(bash "$LIB/deployments.sh" previous "$ENVIRONMENT" "$sha"); fi
        if [ -z "$base" ]; then
          echo "::warning::Nothing before version $VERSION (no older release, tag or deployment), tasks not updated."
          echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
        fi

        gh api --paginate "$repo/compare/$base...$sha?per_page=100" --jq '[.commits[].commit.message]' \
          | jq -s 'add // []' | jq -r -L "$TASK_SYNC" -f "$DIR/tasks.jq" > "$TASKS"
        echo "Commits $base...$sha, tasks: $(paste -sd' ' - < "$TASKS")"

    - name: Update tasks
      if: steps.collect.outputs.skip != 'true'
      shell: bash
      env:
        TASK_TOKEN: ${{ inputs.token }}
        TASK_API: ${{ inputs.api }}
        VERSION: ${{ inputs.version }}
        RELEASE_URL: ${{ steps.collect.outputs.url }}
        DONE_SECTION: ${{ inputs.done-section }}
        READY_SECTION: ${{ inputs.ready-section }}
        TASKS: ${{ runner.temp }}/release-tasks.txt
      run: |
        [ -z "$TASK_TOKEN" ] && { echo "::warning::No task token (secret TASK_TOKEN or ASANA_PAT), tasks not updated."; exit 0; }
        "$GITHUB_ACTION_PATH/update.sh" "$TASKS"
